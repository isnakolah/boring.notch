<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #0A0A0C; }
    a { color: #0A84FF; } a:hover { color: #409CFF; }
    .rounded { font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif; }
    .caps { font: 700 9px/1 system-ui, -apple-system, sans-serif; letter-spacing: 0.09em; text-transform: uppercase; }
    .plane { background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.10); border-radius: 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.07); }
    .ctl { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; flex: none; }
  </style>
</helmet>

<div style="width: 512px; height: 168px; background: #0A0A0C; border-radius: 0 0 24px 24px; box-sizing: border-box; padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; position: relative;">

  <div style="position: absolute; left: 0; right: 0; top: 0; height: 40px; background: linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0)); pointer-events: none;"></div>
  <div style="position: absolute; left: 8px; bottom: -34px; width: 150px; height: 110px; border-radius: 50%; background: radial-gradient(closest-side, rgba(10,132,255,0.30), rgba(10,132,255,0)); filter: blur(16px); pointer-events: none;"></div>

  <div style="display: flex; gap: 10px; align-items: stretch; position: relative;">

    <div class="plane" style="flex-grow: 1; min-width: 0; padding: 11px 14px 12px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 7px;">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: transparent; border: 1px solid rgba(255,255,255,0.42); box-sizing: border-box; flex: none;"></span>
        <span class="caps" style="color: rgba(255,255,255,0.42);">Ready · Classic 25/5</span>
        <span style="flex-grow: 1;"></span>
        <span class="rounded" style="font-size: 10px; color: rgba(255,255,255,0.42); font-variant-numeric: tabular-nums;">Break after 25m</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 12px;">
        <span class="rounded" style="font-size: 36px; font-weight: 700; line-height: 1; color: rgba(255,255,255,0.42); font-variant-numeric: tabular-nums; letter-spacing: -0.015em; flex: none;">25:00</span>
        <span style="font: 400 12px/1.2 system-ui, -apple-system, sans-serif; color: rgba(255,255,255,0.42); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">What are you working on?</span>
      </div>
      <span style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12); display: block;"></span>
    </div>

    <div class="plane" style="width: 118px; flex: none; padding: 11px 12px; display: flex; flex-direction: column; justify-content: center; gap: 4px;">
      <span class="caps" style="color: rgba(255,255,255,0.42);">Today</span>
      <span class="rounded" style="font-size: 22px; font-weight: 700; line-height: 1; color: #FFFFFF; font-variant-numeric: tabular-nums;">3</span>
      <span class="rounded" style="font-size: 11px; color: rgba(255,255,255,0.70); font-variant-numeric: tabular-nums;">1h 20m focused</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; position: relative;">
    <span style="height: 38px; border-radius: 19px; background: #0A84FF; box-shadow: 0 4px 18px rgba(10,132,255,0.55); display: flex; align-items: center; gap: 8px; padding: 0 17px 0 15px; flex: none;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M6 4l14 8-14 8z"/></svg>
      <span style="font: 600 12px/1 system-ui, -apple-system, sans-serif; color: #FFFFFF;">Start focus</span>
    </span>
    <span style="display: flex; align-items: center; gap: 9px; padding: 0 12px; height: 34px; border-radius: 11px; background: rgba(255,255,255,0.08);">
      <span class="caps" style="color: rgba(255,255,255,0.42);">Custom</span>
      <span class="rounded" style="font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.85); font-variant-numeric: tabular-nums;">45m</span>
      <span style="display: flex; flex-direction: column; gap: 2px;">
        <svg width="8" height="5" viewBox="0 0 24 14" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l8-6 8 6"/></svg>
        <svg width="8" height="5" viewBox="0 0 24 14" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l8 6 8-6"/></svg>
      </span>
    </span>
    <span style="flex-grow: 1;"></span>
    <span style="display: flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 11px; background: rgba(255,255,255,0.08);">
      <span style="font: 500 11px/1 system-ui, -apple-system, sans-serif; color: rgba(255,255,255,0.70);">Classic 25/5</span>
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </span>
  </div>

</div>
</x-dc>
</body>
</html>
