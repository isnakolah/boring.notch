<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #0A0A0C; }
    a { color: #0A84FF; } a:hover { color: #409CFF; }
    .rounded { font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif; }
    .caps { font: 700 9px/1 system-ui, -apple-system, sans-serif; letter-spacing: 0.09em; text-transform: uppercase; }
    .plane { background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.10); border-radius: 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.07); }
  </style>
</helmet>

<div style="width: 512px; height: 168px; background: #0A0A0C; border-radius: 0 0 24px 24px; box-sizing: border-box; padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; position: relative;">

  <div style="position: absolute; left: 0; right: 0; top: 0; height: 40px; background: linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0)); pointer-events: none;"></div>
  <div style="position: absolute; left: 120px; bottom: -30px; width: 200px; height: 120px; border-radius: 50%; background: radial-gradient(closest-side, rgba(10,132,255,0.42), rgba(10,132,255,0)); filter: blur(14px); pointer-events: none;"></div>

  <div style="display: flex; gap: 10px; align-items: stretch; position: relative;">

    <div class="plane" style="flex-grow: 1; min-width: 0; padding: 11px 14px 12px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 7px;">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: #0A84FF; box-shadow: 0 0 10px rgba(10,132,255,0.9); flex: none;"></span>
        <span class="caps" style="color: rgba(255,255,255,0.72);">Focus · Block 2</span>
        <span style="flex-grow: 1;"></span>
        <span class="rounded" style="font-size: 10px; color: rgba(255,255,255,0.42); font-variant-numeric: tabular-nums;">Break in 24m</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 12px;">
        <span class="rounded" style="font-size: 36px; font-weight: 700; line-height: 1; color: #FFFFFF; font-variant-numeric: tabular-nums; letter-spacing: -0.015em; flex: none;">24:31</span>
        <span style="font: 400 12px/1.2 system-ui, -apple-system, sans-serif; color: rgba(255,255,255,0.62); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Porting the notch views</span>
      </div>
      <span style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12); display: block; position: relative; overflow: hidden;">
        <span style="position: absolute; inset: 0 32% 0 0; border-radius: 3px; background: linear-gradient(90deg, rgba(10,132,255,0.75), #0A84FF);"></span>
      </span>
    </div>

    <div class="plane" style="width: 118px; flex: none; padding: 11px 12px; display: flex; flex-direction: column; justify-content: center; gap: 4px;">
      <span class="caps" style="color: rgba(255,255,255,0.42);">Today</span>
      <span class="rounded" style="font-size: 22px; font-weight: 700; line-height: 1; color: #FFFFFF; font-variant-numeric: tabular-nums;">3</span>
      <span class="rounded" style="font-size: 11px; color: rgba(255,255,255,0.62); font-variant-numeric: tabular-nums;">1h 20m focused</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; position: relative;">
    <span style="width: 38px; height: 38px; border-radius: 50%; background: #0A84FF; box-shadow: 0 4px 18px rgba(10,132,255,0.55); display: flex; align-items: center; justify-content: center; flex: none;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"><path d="M8 5v14M16 5v14"/></svg>
    </span>
    <span style="width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; flex: none;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5l11 7-11 7z"/><path d="M20 5v14"/></svg>
    </span>
    <span style="width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; flex: none;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </span>
    <span style="width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; flex: none;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="rgba(255,255,255,0.85)"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>
    </span>
    <span style="flex-grow: 1;"></span>
    <span style="display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 10px; background: rgba(255,255,255,0.08);">
      <span style="font: 500 11px/1 system-ui, -apple-system, sans-serif; color: rgba(255,255,255,0.72);">Switch preset</span>
    </span>
  </div>

</div>
</x-dc>
</body>
</html>
