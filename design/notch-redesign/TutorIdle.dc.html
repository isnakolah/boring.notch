<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #0A0A0C; }
    a { color: #0A84FF; } a:hover { color: #409CFF; }
    .rounded { font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif; }
    .caps { font: 700 9px/1 system-ui, -apple-system, sans-serif; letter-spacing: 0.09em; text-transform: uppercase; }
    .plane { background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.10); border-radius: 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.07); }
  </style>
</helmet>

<div style="width: 512px; height: 168px; background: #0A0A0C; border-radius: 0 0 24px 24px; box-sizing: border-box; padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; position: relative;">

  <div style="position: absolute; left: 0; right: 0; top: 0; height: 40px; background: linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0)); pointer-events: none;"></div>

  <div style="display: flex; align-items: center; gap: 8px; position: relative;">
    <span style="width: 7px; height: 7px; border-radius: 50%; background: transparent; border: 1px solid rgba(255,255,255,0.42); box-sizing: border-box; flex: none;"></span>
    <span class="caps" style="color: rgba(255,255,255,0.42);">Tutor · Ready</span>
    <span style="flex-grow: 1; height: 1px; background: rgba(255,255,255,0.12);"></span>
    <span class="rounded" style="font-size: 11px; color: rgba(255,255,255,0.70); font-variant-numeric: tabular-nums;">2 of 12 done</span>
    <span style="width: 22px; height: 22px; border-radius: 7px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; flex: none;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
    </span>
  </div>

  <div class="plane" style="padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; position: relative;">
    <div style="display: flex; align-items: baseline; gap: 9px;">
      <span class="caps" style="color: rgba(255,255,255,0.42); flex: none;">Next</span>
      <span style="font: 600 15px/1.25 system-ui, -apple-system, sans-serif; color: #FFFFFF; letter-spacing: -0.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Bevels and weighted normals</span>
    </div>
    <span style="font: 400 11px/1.35 system-ui, -apple-system, sans-serif; color: rgba(255,255,255,0.70); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Blender · Hard-surface basics · 9 steps, about 12 minutes</span>
    <div style="display: flex; align-items: center; gap: 9px;">
      <span style="flex-grow: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12); display: block; position: relative; overflow: hidden;">
        <span style="position: absolute; inset: 0 83% 0 0; border-radius: 2px; background: rgba(255,255,255,0.42);"></span>
      </span>
      <span class="rounded" style="font-size: 10px; color: rgba(255,255,255,0.42); font-variant-numeric: tabular-nums; flex: none;">lesson 3 of 12</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 9px; position: relative;">
    <span style="height: 34px; border-radius: 11px; background: #0A84FF; box-shadow: 0 4px 16px rgba(10,132,255,0.45); display: flex; align-items: center; gap: 8px; padding: 0 15px 0 13px; flex: none;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M6 4l14 8-14 8z"/></svg>
      <span style="font: 600 12px/1 system-ui, -apple-system, sans-serif; color: #FFFFFF;">Start lesson</span>
    </span>
    <span style="display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 11px; background: rgba(255,255,255,0.08); min-width: 0;">
      <span style="font: 500 11px/1 system-ui, -apple-system, sans-serif; color: rgba(255,255,255,0.70); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Hard-surface basics</span>
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </span>
    <span style="flex-grow: 1;"></span>
    <span class="caps" style="color: rgba(255,255,255,0.42);">Blender is running</span>
  </div>

</div>
</x-dc>
</body>
</html>
