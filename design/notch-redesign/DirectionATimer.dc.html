<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #0A0A0C; }
    a { color: #0A84FF; } a:hover { color: #409CFF; }
    .rounded { font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif; }
    .caps { font: 700 9px/1 system-ui, -apple-system, sans-serif; letter-spacing: 0.09em; text-transform: uppercase; }
  </style>
</helmet>

<div style="width: 512px; height: 168px; background: #0A0A0C; border-radius: 0 0 24px 24px; box-sizing: border-box; padding: 10px 18px 14px; display: flex; flex-direction: column; gap: 0; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 8px;">
    <span style="width: 6px; height: 6px; border-radius: 50%; background: #0A84FF; flex: none;"></span>
    <span class="caps" style="color: #0A84FF;">Focus</span>
    <span class="caps" style="color: rgba(255,255,255,0.42);">Block 2</span>
    <span style="flex-grow: 1;"></span>
    <span class="caps" style="color: rgba(255,255,255,0.42);">Today</span>
    <span class="rounded" style="font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.62); font-variant-numeric: tabular-nums;">3 · 1h 20m</span>
  </div>

  <div style="height: 1px; background: rgba(255,255,255,0.12); margin: 9px 0 0;"></div>

  <div style="display: flex; align-items: flex-end; gap: 18px; padding-top: 11px;">
    <div style="display: flex; flex-direction: column; gap: 1px; flex: none;">
      <span class="caps" style="color: rgba(255,255,255,0.42);">Remaining</span>
      <span class="rounded" style="font-size: 34px; font-weight: 700; line-height: 1; color: #FFFFFF; font-variant-numeric: tabular-nums; letter-spacing: -0.01em;">24:31</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0; padding-bottom: 3px;">
      <span style="font: 400 12px/1.2 system-ui, -apple-system, sans-serif; color: rgba(255,255,255,0.62); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Porting the notch views onto the token set</span>
      <span style="height: 1px; background: rgba(255,255,255,0.12);"></span>
    </div>

    <div style="display: flex; align-items: center; gap: 7px; flex: none; padding-bottom: 2px;">
      <span style="width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(10,132,255,0.85); display: flex; align-items: center; justify-content: center;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0A84FF" stroke-width="2.4" stroke-linecap="round"><path d="M8 5v14M16 5v14"/></svg>
      </span>
      <span style="width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5l11 7-11 7z"/><path d="M20 5v14"/></svg>
      </span>
      <span style="width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </span>
      <span style="width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center;">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="rgba(255,255,255,0.62)"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
      </span>
    </div>
  </div>

  <span style="flex-grow: 1;"></span>

  <div style="display: flex; align-items: center; gap: 10px;">
    <span class="rounded" style="font-size: 10px; color: rgba(255,255,255,0.42); font-variant-numeric: tabular-nums; flex: none;">18/25m</span>
    <span style="flex-grow: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.12); display: block; position: relative; overflow: hidden;">
      <span style="position: absolute; inset: 0 32% 0 0; background: #0A84FF; border-radius: 2px;"></span>
    </span>
    <span class="caps" style="color: rgba(255,255,255,0.42); flex: none;">Break next</span>
  </div>

</div>
</x-dc>
</body>
</html>
