<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #0A0A0C; }
    a { color: #0A84FF; } a:hover { color: #409CFF; }
    .rounded { font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif; }
    .caps { font: 600 10px/1 system-ui, -apple-system, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; }
  </style>
</helmet>

<div style="width: 600px; height: 340px; background: #0A0A0C; border-radius: 0 0 24px 24px; box-sizing: border-box; padding: 18px 30px 16px; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: baseline; gap: 14px;">
    <span class="caps" style="color: #30D158;">Listening</span>
    <span style="flex-grow: 1;"></span>
    <span class="rounded" style="font-size: 11px; color: rgba(255,255,255,0.42); font-variant-numeric: tabular-nums;">12:04</span>
  </div>

  <div style="height: 1px; background: rgba(255,255,255,0.12); margin: 14px 0 18px;"></div>

  <span style="font: 600 23px/1.26 system-ui, -apple-system, sans-serif; color: #FFFFFF; letter-spacing: -0.02em;">Ask who signs before you talk price.</span>

  <div style="display: flex; flex-direction: column; gap: 9px; padding: 18px 0 0 2px;">
    <span style="font: 400 12.5px/1.45 system-ui, -apple-system, sans-serif; color: rgba(255,255,255,0.62);">Their procurement cycle closes in three weeks.</span>
    <span style="font: 400 12.5px/1.45 system-ui, -apple-system, sans-serif; color: rgba(255,255,255,0.62);">Two blockers named: the SOC 2 letter, and a seat count nobody owns.</span>
  </div>

  <span style="flex-grow: 1;"></span>

  <div style="display: flex; align-items: baseline; gap: 12px; padding-bottom: 14px;">
    <span class="caps" style="color: rgba(255,255,255,0.42); flex: none;">Them, now</span>
    <span style="font: 400 11.5px/1.3 system-ui, -apple-system, sans-serif; color: rgba(255,255,255,0.42); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Finance wants the security letter first, then it goes to Dana.</span>
  </div>

  <div style="height: 1px; background: rgba(255,255,255,0.12);"></div>

  <div style="display: flex; align-items: center; gap: 20px; padding-top: 13px;">
    <span class="caps" style="color: rgba(255,255,255,0.62);">Ask</span>
    <span class="caps" style="color: rgba(255,255,255,0.62);">Transcript</span>
    <span class="caps" style="color: rgba(255,255,255,0.62);">Recap</span>
    <span style="flex-grow: 1;"></span>
    <span class="caps" style="color: #FF453A;">End call</span>
  </div>

</div>
</x-dc>
</body>
</html>
