<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #0A0A0C; }
    a { color: #0A84FF; } a:hover { color: #409CFF; }
    .rounded { font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif; }
    .caps { font: 700 9px/1 system-ui, -apple-system, sans-serif; letter-spacing: 0.09em; text-transform: uppercase; }
    .plane { background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.10); border-radius: 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.07); }
  </style>
</helmet>

<div style="width: 512px; height: 168px; background: #0A0A0C; border-radius: 0 0 24px 24px; box-sizing: border-box; padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; position: relative;">

  <div style="position: absolute; left: 0; right: 0; top: 0; height: 40px; background: linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0)); pointer-events: none;"></div>
  <div style="position: absolute; left: 130px; top: 30px; width: 230px; height: 120px; border-radius: 50%; background: radial-gradient(closest-side, rgba(48,209,88,0.26), rgba(48,209,88,0)); filter: blur(20px); pointer-events: none;"></div>

  <div style="display: flex; align-items: center; gap: 8px; position: relative;">
    <span style="width: 7px; height: 7px; border-radius: 50%; background: #30D158; box-shadow: 0 0 10px rgba(48,209,88,0.9); flex: none;"></span>
    <span class="caps" style="color: rgba(255,255,255,0.70);">Tutor · Teaching</span>
    <span style="flex-grow: 1; height: 1px; background: rgba(255,255,255,0.12);"></span>
    <span class="rounded" style="font-size: 11px; color: rgba(255,255,255,0.70); font-variant-numeric: tabular-nums;">Step 4/9</span>
    <span style="width: 22px; height: 22px; border-radius: 7px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; flex: none;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.62)" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
    </span>
  </div>

  <div class="plane" style="padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; position: relative;">
    <span style="font: 600 15px/1.25 system-ui, -apple-system, sans-serif; color: #FFFFFF; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Set the bevel width to 0.02 m</span>
    <span style="font: 400 11px/1.35 system-ui, -apple-system, sans-serif; color: rgba(255,255,255,0.70); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Blender · Hard-surface basics · lesson 3 of 12</span>
    <div style="display: flex; align-items: center; gap: 9px;">
      <span style="flex-grow: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12); display: block; position: relative; overflow: hidden;">
        <span style="position: absolute; inset: 0 56% 0 0; border-radius: 2px; background: linear-gradient(90deg, rgba(48,209,88,0.75), #30D158);"></span>
      </span>
      <span class="rounded" style="font-size: 10px; color: rgba(255,255,255,0.42); font-variant-numeric: tabular-nums; flex: none;">4 of 9 steps</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 9px; position: relative;">
    <span style="display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 11px; background: rgba(255,69,58,0.16); flex: none;">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="#FF453A"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>
      <span style="font: 600 11px/1 system-ui, -apple-system, sans-serif; color: #FF453A;">Stop</span>
    </span>
    <span style="flex-grow: 1; height: 34px; border-radius: 11px; background: rgba(255,255,255,0.08); display: flex; align-items: center; gap: 8px; padding: 0 13px; min-width: 0;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>
      <span style="font: 400 12px/1 system-ui, -apple-system, sans-serif; color: rgba(255,255,255,0.42); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Ask about this step</span>
    </span>
  </div>

</div>
</x-dc>
</body>
</html>
