id: blender.lesson.lamp_shade
title: "Simple Lamp: add shade"
app_versions: ">=5.2 <5.3"
source_refs: [blender-manual, open-tutor-authored]
objective: {given: Base and stem are visible., behavior: Add tapered shade above stem., criterion: Active mesh is visible in Object Mode.}
prerequisites: [{detector: blender.detector.mode_is_object, say: Leave Edit Mode before adding shade.}]
steps: [{id: add_shade, instruction: Add tapered cone shade above stem in viewport., target: blender.ui.viewport, success: {detector: blender.detector.active_object_is_mesh}}]
assessment: {prompt: Add tapered shade without hint., pass: {target: blender.ui.viewport, detector: blender.detector.active_object_is_mesh}}
transfer: {prompt: Make shade narrower at top., differs_by: Stem starts shorter., pass: {target: blender.ui.viewport, detector: blender.detector.active_object_is_mesh}}
retention: {prompt: "Later, place tapered shade from memory.", pass: {target: blender.ui.viewport, detector: blender.detector.active_object_is_mesh}}
misconceptions: [{belief: Shade must be a perfect cylinder., correction: Taper gives simple lamp its readable silhouette.}]
